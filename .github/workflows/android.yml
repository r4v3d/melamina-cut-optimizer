name: Android

# Compila el APK de MelaminaCut con Capacitor.
# - APK de prueba (debug): se descarga desde la pestaña "Actions" > ejecución > Artifacts.
# - APK/AAB firmados para Play Store: solo si existen los secretos ANDROID_KEYSTORE_BASE64,
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD (ver android/README.md).

on:
  push:
    branches: [main, mejoras-usabilidad]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync

      - name: APK de prueba (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: melaminacut-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: APK y AAB firmados (release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: melaminacut-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
